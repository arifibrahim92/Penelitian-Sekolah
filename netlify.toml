[build]
  command = "npm run build"
  publish = ".next"

[functions]
  included_files = ["data/**", "public/**", "src/lib/seedData.json"]
  external_node_modules = ["better-sqlite3"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
